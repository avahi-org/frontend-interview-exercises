name: SAST

on:
  pull_request:
    paths:
      - "**/*.py"

jobs:
  bandit:
    name: SAST scan (Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: |
          bandit -r . --exit-zero --exclude .venv,venv,.git -f txt -o bandit_output.txt

      - name: Check for high severity issues
        run: |
          HIGH=$(grep -m1 -oP 'High:\s+\K[0-9]+' bandit_output.txt || echo 0)
          if [ "$HIGH" -gt 0 ]; then
            echo "FAIL: $HIGH high severity issue(s) found"
            exit 1
          fi

      - name: Post PR comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('bandit_output.txt', 'utf8');

            const high = parseInt((output.match(/High:\s+(\d+)/) || [, '0'])[1]);
            const med  = parseInt((output.match(/Medium:\s+(\d+)/) || [, '0'])[1]);
            const low  = parseInt((output.match(/Low:\s+(\d+)/)    || [, '0'])[1]);

            const summary = `| High | Medium | Low |\n|------|--------|-----|\n| ${high} | ${med} | ${low} |`;
            let detail = output.length > 60000 ? output.substring(0, 60000) + '\n\n... (truncated)' : output;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                `## \u274C SAST Scan Failed (Python)\n\n${high} high severity issue(s) found.`,
                '',
                summary,
                '',
                '<details>',
                '<summary>Full output</summary>',
                '',
                '```',
                detail,
                '```',
                '',
                '</details>',
              ].join('\n'),
            });
