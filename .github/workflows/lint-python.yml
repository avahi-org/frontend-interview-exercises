name: Lint (Python)

on:
  push:
    paths:
      - "**/*.py"
  pull_request:
    paths:
      - "**/*.py"

jobs:
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          ruff check . --exclude "**/*.ipynb" 2>&1 | tee lint_output.txt

      - name: Post PR comment
        if: steps.lint.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try { output = fs.readFileSync('lint_output.txt', 'utf8'); } catch (_) {}
            const truncated = output.length > 60000
              ? output.substring(0, 60000) + '\n\n... (truncated)'
              : output;
            const body = [
              '## \u274C Python Lint Failed',
              '',
              '<details>', '<summary>Output</summary>', '', '```', truncated, '```', '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if lint failed
        if: always() && steps.lint.outcome == 'failure'
        run: exit 1
