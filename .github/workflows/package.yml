name: Package candidate zip

# On every merge/push to main, rebuild the clean candidate snapshot and
# publish it as the "latest" GitHub Release asset. git archive only includes
# tracked files, so the gitignored interviewer answer key is never bundled.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: package-release
  cancel-in-progress: true

jobs:
  package:
    name: Build and publish snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build snapshot zip
        run: git archive --format=zip --prefix=frontend-interview-exercises/ -o frontend-interview-exercises.zip HEAD

      # #51: README.md is the single source of truth for both audiences.
      # Sections wrapped in DEV-ONLY:START/END markers are dev-only and get
      # stripped out of the candidate copy here, rather than maintaining a
      # separate README.candidate.md that could drift out of sync.
      - name: Strip dev-only README sections for candidates
        run: |
          set -euo pipefail
          repo_dir=$(pwd)
          workdir=$(mktemp -d)
          unzip -q frontend-interview-exercises.zip -d "$workdir"
          sed -i '/^<!-- DEV-ONLY:START -->$/,/^<!-- DEV-ONLY:END -->$/d' \
            "$workdir/frontend-interview-exercises/README.md"
          rm frontend-interview-exercises.zip
          (cd "$workdir" && zip -qr "$repo_dir/frontend-interview-exercises.zip" frontend-interview-exercises)
          rm -rf "$workdir"

      # Regression guard for #18: the denylist lives in .gitattributes
      # (export-ignore); this re-derives it and fails the build if anything
      # on it leaked into the archive, instead of relying on export-ignore
      # silently doing the right thing forever.
      - name: Verify no internal-only paths leaked into the zip
        run: |
          set -euo pipefail
          zip_contents=$(unzip -Z1 frontend-interview-exercises.zip)
          failed=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if echo "$zip_contents" | grep -qF "$path"; then
              echo "::error::Denylisted path leaked into candidate zip: $path"
              failed=1
            fi
          done < <(grep -E 'export-ignore\s*$' .gitattributes | awk '{print $1}')
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
          if unzip -p frontend-interview-exercises.zip '*/README.md' | grep -q 'DEV-ONLY'; then
            echo "::error::Dev-only README marker survived into the candidate zip"
            failed=1
          fi
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
          echo "OK: no denylisted paths or dev-only README content found in candidate zip"

      - name: Publish / update "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest frontend-interview-exercises.zip --clobber
          else
            gh release create latest frontend-interview-exercises.zip \
              --title "Latest candidate snapshot" \
              --notes "Auto-built from main. Interviewer answer key excluded."
          fi
