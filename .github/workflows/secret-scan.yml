name: Secret Scan

on:
  pull_request:
  push:

jobs:
  gitleaks:
    name: Detect secrets with gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.18.4"
          wget https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          tar -xvzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run gitleaks
        run: |
          echo '[]' > gitleaks_report.json
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LOG_OPTS="origin/${{ github.base_ref }}..HEAD"
          else
            LOG_OPTS="HEAD~1..HEAD"
          fi
          gitleaks detect --source . --log-opts="$LOG_OPTS" --redact \
            --report-format json --report-path gitleaks_report.json || true

      - name: Check for leaks
        run: |
          COUNT=$(python3 -c "import json; d=json.load(open('gitleaks_report.json')); print(len(d))")
          echo "Leaks found: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "FAIL: $COUNT secret(s) detected"
            exit 1
          fi

      - name: Post PR comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('fs');
            const findings = JSON.parse(fs.readFileSync('gitleaks_report.json', 'utf8'));

            const rows = findings.map(f =>
              `| \`${f.File}\` | ${f.StartLine} | ${f.RuleID} | ${(f.Commit || '').slice(0, 7) || '\u2014'} |`
            );

            const table = ['| File | Line | Rule | Commit |', '|------|------|------|--------|', ...rows].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                `## \u274C Secret Scan Failed\n\n${findings.length} secret(s) detected. Remove them and rotate immediately.`,
                '',
                table,
              ].join('\n'),
            });
